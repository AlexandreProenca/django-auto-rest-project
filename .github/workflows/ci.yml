name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Guarda o contrato de empacotamento: os templates precisam sobreviver
      # ao sdist/wheel, senao o robot quebra so na instalacao via pip.
      # A lista sai da arvore de fontes, entao nao precisa ser mantida a mao.
      - name: Assert every template survives into the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          source = pathlib.Path("robot_rest/templates")
          expected = {
              f"robot_rest/templates/{p.relative_to(source).as_posix()}"
              for p in source.rglob("*.j2")
          }
          if not expected:
              sys.exit("no templates found in the source tree")
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          missing = sorted(expected - set(zipfile.ZipFile(wheel).namelist()))
          if missing:
              sys.exit(f"missing from {wheel.name}: {missing}")
          print(f"{wheel.name}: all {len(expected)} templates present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Trusted publishing: requer configurar o publisher em pypi.org.
      # Nao usa token/senha em secrets.
      - uses: pypa/gh-action-pypi-publish@release/v1
