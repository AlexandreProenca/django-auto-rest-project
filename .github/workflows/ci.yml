name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Guarda o contrato de empacotamento: os templates precisam sobreviver
      # ao sdist/wheel, senao o robot quebra so na instalacao via pip.
      - name: Assert templates are present in the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          expected = {
              "robot_rest/requirements.txt",
              "robot_rest/urls.tpl",
              "robot_rest/settings/defaults.tpl",
              "robot_rest/settings/dev.tpl",
              "robot_rest/settings/production.tpl",
              "robot_rest/settings/tests.tpl",
              "robot_rest/settings/__init__.tpl",
              "robot_rest/tests/__init__.tpl",
              "robot_rest/tests/settingstest.tpl",
              "robot_rest/tests/test_rest_api.tpl",
          }
          missing = sorted(expected - names)
          if missing:
              sys.exit(f"missing from {wheel.name}: {missing}")
          print(f"{wheel.name}: all {len(expected)} data files present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Trusted publishing: requer configurar o publisher em pypi.org.
      # Nao usa token/senha em secrets.
      - uses: pypa/gh-action-pypi-publish@release/v1
