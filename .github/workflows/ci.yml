name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  # A suite unitaria roda so com SQLite. Este job existe para exercitar os
  # drivers de verdade -- em especial o mysqlclient, que precisa da biblioteca
  # cliente C e nao roda na maquina de todo mundo.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL and PostgreSQL
        run: docker compose up -d --wait mysql postgres
      - name: Run the suite inside the container, against both databases
        run: docker compose run --rm tests
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --tail=50 mysql postgres
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Prova que a imagem publicada gera um projeto de verdade, nao so que ela
  # constroi.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait postgres
      - run: docker build -t robot-rest:ci --target runtime .
      - name: Generate a project through the image
        run: |
          mkdir -p out
          docker run --rm \
            --network "$(docker inspect "$(docker compose ps -q postgres)" \
              --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')" \
            -v "$PWD/out:/work" --user "$(id -u):$(id -g)" \
            -e ROBOT_REST_DB_PASSWORD='s3cr3t#pass' \
            robot-rest:ci -engine postgres -ip postgres -port 5432 \
            -user appuser -database shopdb -project ciapi
          test -f out/ciapi/manage.py
          test -f out/ciapi/core/serializers.py
          grep -q 'router.register(r"customer"' out/ciapi/core/urls.py
          # Arquivos gerados devem pertencer a quem chamou, nao ao root.
          test "$(stat -c '%u' out/ciapi/manage.py)" = "$(id -u)"
      - if: always()
        run: docker compose down -v

  build:
    runs-on: ubuntu-latest
    # publish depende de build, entao tudo listado aqui vira pre-requisito de
    # release: nada vai para o PyPI sem passar contra os bancos reais.
    needs: [lint, test, integration, docker-image]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Guarda o contrato de empacotamento: os templates precisam sobreviver
      # ao sdist/wheel, senao o robot quebra so na instalacao via pip.
      # A lista sai da arvore de fontes, entao nao precisa ser mantida a mao.
      - name: Assert every template survives into the wheel
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          source = pathlib.Path("robot_rest/templates")
          expected = {
              f"robot_rest/templates/{p.relative_to(source).as_posix()}"
              for p in source.rglob("*.j2")
          }
          if not expected:
              sys.exit("no templates found in the source tree")
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          missing = sorted(expected - set(zipfile.ZipFile(wheel).namelist()))
          if missing:
              sys.exit(f"missing from {wheel.name}: {missing}")
          print(f"{wheel.name}: all {len(expected)} templates present")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Trusted publishing: requer configurar o publisher em pypi.org.
      # Nao usa token/senha em secrets.
      - uses: pypa/gh-action-pypi-publish@release/v1
